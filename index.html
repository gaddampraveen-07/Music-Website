<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/utility.css">
    <link rel="shortcut icon" href="img/icon.ico" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap');
    </style>
</head>

<body>
    <div class="top invert">
        <div class=" logo invert "><img src="img/music1.svg" alt="Spotify"></div>
        <div class="  hamburgercont">
            <img class=" hamburger" src="img/hamburger.svg" alt="hamburger">
        </div>
        <div class="btn1 flex invert">

            <div class="search invert"> <img src="img/Search.svg" alt="search"></div>
            <input class="find " type="text" placeholder="What do you want to play ?">
            <button class="bt" type="button">
                <span class="symbol invert">
                    <img src="img/Symbol.svg" alt="symbol">
                </span>
            </button>
        </div>
        <div class="buttons">
            <button class="sign">Sign up</button>
            <button class="log">Log in</button>
        </div>
    </div>
    <div class="container flex ">
        <div class="left border bg-grey">
            <div class="left2 flex">
                <header class="h1 ">Your Library</header>
                <div class="close invert">
                    <img src="img/cross.svg" alt="cross">
                </div>
            </div>
            <div class="left1">


                <div class="songlist">
                    <ul>
                    </ul>
                </div>
            </div>
            <div class="lt1">

                <section class="s1">
                    <h3>Create your first playlist</h3>
                    <h4>It's easy,we'll help you</h4>

                </section>
                <section class="s2">
                    <h3>Let's find some podcasts to follow</h3>
                    <h4> We'll keep you updated on new episodes</h4>
                </section>
            </div>
            <div class="last grid">
                <div class="last1">
                    <a href="https://www.spotify.com/in-en/legal/" class="a"><span>Legal</span></a>
                </div>
                <div class="last2">
                    <a href="https://www.spotify.com/in-en/safetyandprivacy/" class="a"><span>Safety and
                            Privacy</span></a>
                </div>
                <div class="last3">
                    <a href="https://www.spotify.com/in-en/legal/privacy-policy/" class="a"><span>Privacy
                            Policy</span></a>
                </div>
                <div class="last4"><a href="https://www.spotify.com/in-en/legal/cookies-policy/"
                        class="a"><span>Cookies</span></a>
                </div>
                <div class="last5">
                    <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" class="a"><span>About
                            Ads</span></a>
                </div>
                <div class="last6">
                    <a href="https://www.spotify.com/in-en/accessibility/" class="a"> <span> Accessibility</span></a>
                </div>
            </div>
            <div class="last7">
                <a href="https://www.spotify.com/legal/cookies-policy/" class="a"><span>Cookies</span></a>
            </div>
            <div class="final invert">
                <button class="btn5"><img class="i" src="img/globe.svg" alt="Globe"><span
                        class="clg">English</span></button>
            </div>
        </div>
        <div class="right border bg-grey">
            <div class="right1">
                <header class="r-head">Trending Songs</header>
                <span class="option"> Show all </span>
            </div>
            <div class="right-container">
            </div>
            <div class="playbar">
                <div class="seekbar">
                    <div class="circle">

                    </div>
                </div>
                <div class="toplayer">

                    <div class="songinfo">

                    </div>
                    <div class="songbuttons">
                        <div class="previous">
                            <img width="40" id="previous" src="img/previous.svg" alt="previous">
                        </div>
                        <div>
                            <img class="play" width="40" id="play" src="img/play.svg" alt="play">
                        </div>
                        <div class="next">
                            <img width="40" id="next" src="img/next.svg" alt="next">
                        </div>
                    </div>
                    <div class="volb">

                        <div class="songtime"> </div>
                        <div class="volume">
                            <img width="25" src="img/volume.svg" alt="volume">
                            <div class="range">
                                <input type="range" name="volume" id="range" min="0" max="100" value="100" style="cursor: pointer;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="JS/javascript.js"></script>
</body>

</html>
